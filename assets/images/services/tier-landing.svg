<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A single landing page laid out in a browser window">
  <rect width="640" height="400" fill="#f5f5f5"/>

  <!-- browser window -->
  <g>
    <rect x="120" y="52" width="400" height="296" rx="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <path d="M120 88h400" stroke="#000" stroke-width="1.5"/>
    <circle cx="142" cy="70" r="4" fill="#ed4337"/>
    <circle cx="158" cy="70" r="4" fill="#b3b3b3"/>
    <circle cx="174" cy="70" r="4" fill="#b3b3b3"/>
    <rect x="196" y="64" width="120" height="12" rx="6" fill="#f5f5f5"/>
  </g>

  <!-- hero copy -->
  <rect x="152" y="122" width="176" height="14" rx="7" fill="#000"/>
  <rect x="152" y="146" width="128" height="14" rx="7" fill="#000"/>
  <rect x="152" y="178" width="150" height="7" rx="3.5" fill="#b3b3b3"/>
  <rect x="152" y="193" width="112" height="7" rx="3.5" fill="#b3b3b3"/>
  <rect x="152" y="220" width="92" height="30" rx="15" fill="#ed4337"/>

  <!-- hero visual -->
  <rect x="366" y="118" width="122" height="132" rx="10" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <circle cx="396" cy="150" r="9" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <path d="M374 236l30-40 24 28 16-18 24 30z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- section below the fold -->
  <rect x="152" y="278" width="104" height="46" rx="8" fill="#fff" stroke="#b3b3b3" stroke-width="1.5"/>
  <rect x="268" y="278" width="104" height="46" rx="8" fill="#fff" stroke="#b3b3b3" stroke-width="1.5"/>
  <rect x="384" y="278" width="104" height="46" rx="8" fill="#fff" stroke="#b3b3b3" stroke-width="1.5"/>

  <!-- scroll rail -->
  <path d="M556 96v208" stroke="#b3b3b3" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M556 96v76" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>
